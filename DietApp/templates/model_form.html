{% extends "base.html" %}
{% block title %}{{ title }} - Diet Services{% endblock %}
{% block content %}
    <section class="panel" style="max-width: 720px; margin-right: auto; margin-left: auto;">
        <h1>{{ title }}</h1>
        {% if form.errors %}<p class="message error" role="alert">Please correct the errors below.</p>{% endif %}
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="action-row">
                <button class="action" type="submit">Save</button>
                <a class="action secondary" href="{{ cancel_url|default:'/' }}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
